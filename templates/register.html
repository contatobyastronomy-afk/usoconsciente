{% extends 'base.html' %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>Criar <span class="highlight">conta</span></h2>
        <p class="auth-sub">Cadastre-se para acessar os dados da pesquisa.</p>

        <form method="POST" action="/register" class="auth-form">
            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required>
            </div>
            <div class="form-group">
                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Repita a senha" required>
            </div>
            <button type="submit" class="btn-primary btn-full">Criar conta</button>
        </form>

        <p class="auth-switch">
            Já tem conta? <a href="/login">Fazer login</a>
        </p>
    </div>
</section>
{% endblock %}
